name: Update citation count

# Refreshes public/data/scholar.json from Google Scholar once a month so the
# citation number on the site stays current without manual edits.
#
# Runs from `main` (the default branch and the source of the GitHub Pages
# deploy). It updates and pushes scholar.json on `main`; the subsequent push
# triggers the Pages deploy so the new number goes live automatically.
# You can also run it on demand via the "Run workflow" button.
#
# KNOWN LIMITATION: Google Scholar blocks datacenter IPs, so this scheduled run
# usually gets HTTP 403 and can't refresh anything. It won't fail the job (the
# cached value is still valid data), but the script now emits a warning
# annotation and a job summary so a skipped run is visible rather than looking
# like a successful no-op. The reliable refresh path is local:
#
#     npm run update-citations && git commit -am "chore: refresh citations" && git push
#
# Keep the schedule anyway: it costs nothing and does work if Scholar ever
# stops blocking the runner IP range.

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest citation count
        run: node scripts/update-citations.mjs
        env:
          SCHOLAR_ID: ni4A6KgAAAAJ

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/data/scholar.json)" ]]; then
            git config user.name "arunbodd"
            git config user.email "[email-redacted]"
            git add public/data/scholar.json
            git commit -m "chore: auto-update Google Scholar citation count"
            git push origin main
          else
            echo "No change to citation count."
          fi
